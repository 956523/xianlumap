<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>景点审核台 · xianlumap</title>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #1f2937; }
    #layout { display: flex; height: 100vh; }
    #side { width: 400px; flex: none; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #e2e8f0; }
    #side header { padding: 14px 16px 8px; border-bottom: 1px solid #f1f5f9; }
    #side h1 { font-size: 16px; margin: 0 0 2px; }
    #side .sub { font-size: 11px; color: #94a3b8; }
    #tabs { display: flex; gap: 4px; padding: 8px 12px 0; flex-wrap: wrap; }
    #tabs button { border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 7px; padding: 3px 10px; font-size: 11.5px; cursor: pointer; color: #475569; font-family: inherit; }
    #tabs button.on { background: #0f766e; border-color: #0f766e; color: #fff; }
    #progress { padding: 6px 16px; font-size: 11px; color: #64748b; }
    #progress .bar { height: 5px; background: #f1f5f9; border-radius: 3px; margin-top: 4px; overflow: hidden; }
    #progress .bar i { display: block; height: 100%; background: #0d9488; width: 0; transition: width .2s; }
    #list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
    .item { display: flex; gap: 8px; align-items: flex-start; padding: 8px 8px; border-radius: 9px; cursor: pointer; }
    .item:hover { background: #f8fafc; }
    .item.sel { background: #f0fdfa; outline: 1px solid #99f6e4; }
    .item.manual { opacity: .55; cursor: default; }
    .item .nm { font-size: 12.5px; font-weight: 600; color: #0f172a; line-height: 1.4; }
    .item .meta { font-size: 10.5px; color: #94a3b8; margin-top: 2px; line-height: 1.5; }
    .item .grow { flex: 1; min-width: 0; }
    .tag { flex: none; font-size: 10px; padding: 1px 6px; border-radius: 6px; }
    .tag.kind { background: #ede9fe; color: #6d28d9; }
    .tag.st-ok { background: #dcfce7; color: #15803d; }
    .tag.st-no { background: #fee2e2; color: #b91c1c; }
    .tag.st-his { background: #e2e8f0; color: #64748b; }
    .acts { flex: none; display: flex; gap: 3px; }
    .acts button { border: 1px solid #e2e8f0; background: #fff; width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; }
    .acts button.ok:hover { background: #dcfce7; border-color: #16a34a; }
    .acts button.no:hover { background: #fee2e2; border-color: #dc2626; }
    #foot { padding: 10px 16px; border-top: 1px solid #f1f5f9; display: flex; gap: 8px; align-items: center; }
    #foot .stat { font-size: 11px; color: #64748b; flex: 1; }
    #btnExport { border: none; background: #0f766e; color: #fff; border-radius: 8px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
    #btnExport:hover { background: #0d9488; }
    #map { flex: 1; }
    #autotest-result { display: none; }
    @media (max-width: 860px) { #side { width: 320px; } }
</style>
<script src="../key.local.js"></script>
<script>
    /* 底图加载（复用主站 key.local.js 模式；安全密钥先行注入） */
    (function () {
        var K = window.__KEY_LOCAL__ || {};
        if (K.amapSecurity) window._AMapSecurityConfig = { securityJsCode: K.amapSecurity };
        if (K.amapKey) {
            document.write('<script src="https://webapi.amap.com/maps?v=2.0&key=' + encodeURIComponent(K.amapKey) + '"><\/script>');
        }
    })();
</script>
</head>
<body>
<div id="layout">
    <div id="side">
        <header>
            <h1>景点审核台</h1>
            <div class="sub">脚本只抓候选，值不值得去是你说了算 · 改动存本机浏览器，导出后交给维护者入库</div>
        </header>
        <div id="tabs"></div>
        <div id="progress">加载中…</div>
        <div id="list"></div>
        <div id="foot">
            <span class="stat" id="footStat"></span>
            <button id="btnExport">导出审核结果</button>
        </div>
    </div>
    <div id="map"></div>
</div>
<div id="autotest-result"></div>
<script src="review-spots.js"></script>
</body>
</html>
