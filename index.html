<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>自驾线路图</title>
<style>
    /* ============ 层级体系（关键！） ============
       腾讯地图 GL JS 会在 #map 内部插入 z-index:1000 的覆盖层容器。
       所有浮在页面上的 UI 必须 > 1000，否则会被地图吃掉鼠标事件
       （表现：看得见、点不动 —— 曾导致剖面面板无法展开）。 */
    :root {
        --z-map-overlay: 1000;   /* 腾讯地图内部覆盖层（外部值，勿改） */
        --z-panel:       1100;   /* 侧栏 */
        --z-drawer:      1200;   /* 底部抽屉（剖面） */
        --z-collapse:    1250;   /* 侧栏收起按钮（要在抽屉之上） */
        --z-tip:         1300;   /* 悬浮提示 */
        --z-guide:       1400;   /* 编辑引导弹层（在提示之上） */
    }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f1f5f9; }
    /* 地图容器高度 = 视口 − 底部抽屉占用高度（--elev-occupy）。
       这样地图的"中心"永远是真正可见区域的中心，路线不会被抽屉压住。
       这是地图软件处理「面板遮挡」的标准做法：改容器，不是改内容。 */
    #map {
        width: 100%; height: calc(100vh - var(--elev-occupy, 0px));
        transition: height .26s cubic-bezier(.32,.72,0,1);
    }
    #panel {
        position: fixed; top: 14px; left: 14px; width: 296px;
        /* 底部留出抽屉 peek 的高度（--peek，默认 46px）：否则侧栏底部
           （"回到全览"按钮 + 免责声明）会被展开/半收的抽屉压住，
           两者 z-index 不同层 → 看得见按钮却点不到，或字被切断。 */
        max-height: calc(100vh - 28px - 60px); overflow-y: auto;
        background: #ffffff; border-radius: 16px;
        box-shadow: 0 10px 36px rgba(15, 23, 42, .22);
        padding: 16px 16px 12px; z-index: var(--z-panel);
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: #1f2937; box-sizing: border-box;
        transition: max-height .18s ease, bottom .18s ease;
        display: flex; flex-direction: column;
    }
    /* 侧栏与底部抽屉是独立浮层，互不挤占（抽屉浮在侧栏之上，这是地图软件惯例） */
    #panel h1 { margin: 0 0 2px; font-size: 19px; letter-spacing: .5px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    /* 侧栏自带收起按钮（面板自己折叠，不依赖外部悬浮按钮） */
    #panelFold {
        flex: none; border: none; background: #f1f5f9; color: #64748b;
        width: 22px; height: 22px; border-radius: 7px; cursor: pointer;
        font-size: 15px; line-height: 1; padding: 0; font-family: inherit;
    }
    #panelFold:hover { background: #e2e8f0; color: #0f766e; }
    /* 收起态：整体滑出左侧，只留一个把手 */
    #panel.collapsed { transform: translateX(calc(-100% - 20px)); opacity: 0; pointer-events: none; }
    #panel { transition: transform .24s cubic-bezier(.32,.72,0,1), opacity .2s; }
    /* 侧栏收起后的把手 */
    #panelHandle {
        display: none; position: fixed; top: 14px; left: 14px; z-index: var(--z-collapse);
        background: #fff; color: #0f766e; border: 1px solid #e2e8f0; border-radius: 10px;
        padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
        box-shadow: 0 6px 20px rgba(15,23,42,.16); font-family: inherit;
    }
    #panelHandle:hover { background: #f0fdfa; }
    #panelHandle.show { display: block; }
    .seg { display: flex; background: #f1f5f9; border-radius: 9px; padding: 3px; gap: 2px; flex: none; }
    .seg button { border: none; background: none; padding: 4px 9px; border-radius: 7px; font-size: 12px; cursor: pointer; color: #64748b; font-weight: 600; }
    .seg button.on { background: #0f766e; color: #fff; }
    #panel .sub { font-size: 12px; color: #64748b; margin-bottom: 10px; }
    .chips { display: flex; gap: 6px; margin-bottom: 12px; }
    .chip {
        /* min-width:0 是关键：flex 子项默认 min-width:auto，长数字（如"最高海拔 3794"）
           会把卡片顶宽 → 三块一起溢出面板、被右侧裁掉。必须允许收缩。 */
        flex: 1; min-width: 0; text-align: center; background: #f1f5f9; border-radius: 9px;
        padding: 6px 4px; font-size: 11px; color: #475569; line-height: 1.35;
        overflow: hidden;
    }
    .chip b { display: block; font-size: 14px; color: #0f766e; }
    .day-list { list-style: none; margin: 0; padding: 0; }
    .day-list li {
        display: flex; align-items: center; gap: 8px;
        padding: 7px 8px; border-radius: 9px; cursor: pointer;
        font-size: 12.5px; transition: background .15s;
    }
    .day-list li:hover { background: #f1f5f9; }
    .day-list li.active { background: #fff7ed; outline: 1px solid #fdba74; }
    .day-tag {
        flex: none; width: 38px; text-align: center; font-weight: 700; font-size: 11px;
        color: #0f766e; background: #ccfbf1; border-radius: 6px; padding: 3px 0;
    }
    li.active .day-tag { background: #ea580c; color: #fff; }
    /* day-meta 必须显式 flex column：title/note 是两个 inline span，
       不设 column 就会横向并排 —— 窄视口一挤压就变成"标题里插了备注" */
    .day-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    /* 标题行 + 备注行在窄面板里会互相挤 → 标题只能显示 "西宁 → 青..."。
       行高固定、允许省略号，但优先保证标题拿到宽度（备注行右边有 km，标题行没有）。 */
    .day-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .day-note { color: #94a3b8; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .day-km { flex: none; color: #64748b; font-size: 11px; }
    /* sparkline 是最低信息密度的一块：面板宽度不足时先把它收窄，
       而不是让标题先被截断（标题被截断用户根本不知道点的是哪一天）。 */
    .day-spark {
        flex: none; width: 44px; height: 24px; border-radius: 6px;
        background: #f8fafc; border: 1px solid #e2e8f0; overflow: hidden;
    }
    .day-spark svg { display: block; }
    li.active .day-spark { border-color: #fdba74; background: #fff7ed; }
    /* 窄视口：sparkline 先让位（信息密度最低），保住标题+里程可读 */
    @media (max-width: 860px) {
        .day-spark { display: none; }
        .day-list li { gap: 6px; padding: 6px 6px; }
        .day-tag { width: 32px; }
    }
    .legend { border-top: 1px solid #e2e8f0; margin-top: 10px; padding-top: 10px; }
    .legend > summary { display: none; }              /* 桌面：summary 隐藏，图例行常显（details 保持 open） */
    .legend .row { display: flex; align-items: center; justify-content: space-between; padding: 3px 2px; font-size: 12px; color: #475569; }
    .legend > summary { cursor: pointer; font-size: 12px; color: #475569; padding: 4px 2px; font-weight: 600; list-style: none; }
    .legend > summary::before { content: '▸ '; color: #94a3b8; }
    .legend[open] > summary::before { content: '▾ '; }
    .legend .row .name { display: flex; align-items: center; gap: 7px; }
    /* S0 分级提示：远景时加油站被自动隐藏，得让用户知道"不是我关的，是放大了才出现"，
       否则会以为图层开关坏了。 */
    .tierHint { font-size: 10px; color: #94a3b8; font-weight: 400; }
    .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
    .dot.city { background: #1e3a5f; }
    .dot.spot { background: #7c3aed; }
    .dot.fuel { background: #dc2626; }
    .dot.ev { background: #16a34a; }
    .dot.cls { background: #c026d3; }
    .dot.line { background: #0d9488; height: 4px; border-radius: 2px; }
    .switch { position: relative; width: 32px; height: 18px; flex: none; }
    .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 2; }
    .switch .track { position: absolute; inset: 0; background: #cbd5e1; border-radius: 9px; transition: background .15s; }
    .switch .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
    .switch input:checked ~ .track { background: #0d9488; }
    .switch input:checked ~ .knob { left: 16px; }
    .btn-fit {
        display: block; width: 100%; margin-top: 10px; padding: 8px 0;
        border: none; border-radius: 9px; background: #0f766e; color: #fff;
        font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-fit:hover { background: #0d9488; }
    .evcard { border-top: 1px solid #e2e8f0; margin-top: 10px; padding-top: 10px; }
    .evrow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #475569; margin-bottom: 6px; }
    .evrow input[type="range"] { accent-color: #0f766e; }
    .evplan { margin-top: 4px; max-height: 170px; overflow-y: auto; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 9px; padding: 7px 9px; }
    .psum { font-size: 11.5px; color: #0f766e; font-weight: 600; padding-bottom: 4px; border-bottom: 1px solid #e2e8f0; margin-bottom: 3px; }
    .prow { font-size: 11.5px; padding: 3px 0; border-bottom: 1px dashed #e2e8f0; line-height: 1.5; color: #334155; }
    .prow b { color: #ea580c; margin-right: 5px; }
    .prow span { color: #16a34a; float: right; }
    .warn { color: #b91c1c; font-size: 11.5px; padding: 3px 0; }
    .tip { font-size: 11px; color: #94a3b8; margin-top: 8px; line-height: 1.5; }
    @media (max-width: 720px) {
        /* 面板形态由下方 768 抽屉系统接管（bottom sheet）；此处只留字号/间距档位 */
        /* chip 三块在 390px 宽下必须能挤下：字号降一档 + 内边距收紧。
           不改字体的话"最高海拔 m"会把第三块顶出面板右边界（被 overflow 裁掉）。 */
        .chips { gap: 5px; margin-bottom: 10px; }
        .chip { font-size: 9.5px; padding: 5px 2px; letter-spacing: -.2px; }
        .chip b { font-size: 12px; }
        #panel h1 { font-size: 16.5px; }
        #panel .sub { font-size: 11px; margin-bottom: 8px; }
        /* 窄屏 day 行再压一档，保证标题不截断 */
        .day-list li { gap: 5px; padding: 5px 5px; }
        .day-tag { width: 30px; font-size: 10.5px; }
        .day-title { font-size: 12px; }
        .day-note, .day-km { font-size: 10.5px; }
    }
    /* 中等视口：侧栏收窄，给地图留出可用横向空间 */
    @media (min-width: 721px) and (max-width: 1000px) {
        #panel { width: 252px; padding: 14px 13px 10px; }
        #panel h1 { font-size: 17px; }
        .chip b { font-size: 13px; }
        .chip { font-size: 10.5px; }
    }
    /* 自绘细滚动条，避免 Windows 原生宽滚动条在面板里显得脏 */
    #panel::-webkit-scrollbar { width: 8px; }
    #panel::-webkit-scrollbar-track { background: transparent; }
    #panel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    #panel::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    /* 信息窗内容 */
    .iw { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; min-width: 180px; }
    .iw h3 { margin: 0 0 4px; font-size: 14.5px; color: #0f172a; }
    .iw .tag { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 8px; margin-bottom: 5px; margin-right: 4px; }
    .iw .tag.f { background: #fee2e2; color: #b91c1c; }
    .iw .tag.e { background: #dcfce7; color: #15803d; }
    .iw .tag.c { background: #e0f2fe; color: #0369a1; }
    .iw .tag.s { background: #ede9fe; color: #6d28d9; }
    .iw p { margin: 3px 0 0; font-size: 12px; color: #475569; line-height: 1.55; }
    /* ============ 底部抽屉（海拔剖面 & 能耗） ============
       地图软件惯例：贴底、圆角、可拖拽手柄调高度、下拖到底自动收起。
       抽屉独立浮在地图与侧栏之上，不与侧栏抢空间（不再需要避让计算）。 */
    #elev {
        position: fixed; left: 14px; right: 14px; bottom: 14px; z-index: var(--z-drawer);
        background: #fff; border-radius: 16px;
        box-shadow: 0 -6px 28px rgba(15,23,42,.18);
        padding: 0 16px 10px; box-sizing: border-box;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #1f2937;
        transform: translateY(calc(100% - var(--peek, 46px) + 14px));
        transition: transform .26s cubic-bezier(.32,.72,0,1);
        display: flex; flex-direction: column;
    }
    /* 展开态：完整露出，高度由 --drawer-h 控制 */
    #elev.open { transform: translateY(0); height: var(--drawer-h, 300px); }
    /* 拖拽中禁用过渡，跟手 */
    #elev.dragging { transition: none; }

    /* 拖拽手柄：地图软件抽屉的标志性元素 */
    #elevGrip {
        flex: none; height: 16px; display: flex; align-items: center; justify-content: center;
        cursor: grab; touch-action: none; margin: 0 -16px;
    }
    #elevGrip::before {
        content: ''; width: 42px; height: 4px; border-radius: 2px; background: #cbd5e1;
        transition: background .15s, width .15s;
    }
    #elevGrip:hover::before { background: #94a3b8; width: 56px; }
    #elev.dragging #elevGrip { cursor: grabbing; }

    #elev .head {
        flex: none; display: flex; align-items: center; gap: 8px;
        padding: 4px 0 6px; user-select: none; border-bottom: 1px solid #e2e8f0;
    }
    #elev .head b { font-size: 14px; white-space: nowrap; cursor: pointer; }
    #elev .head .fold { font-size: 12px; color: #94a3b8; }
    #elev .head .spacer { flex: 1; }
    #elev .foldbtn {
        border: none; background: #f1f5f9; color: #475569; border-radius: 8px;
        padding: 4px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer;
        font-family: inherit; line-height: 1.5;
    }
    #elev .foldbtn:hover { background: #e2e8f0; }
    #elev .closebtn { border: none; background: #f1f5f9; color: #475569; border-radius: 8px; padding: 3px 9px; font-size: 14px; cursor: pointer; }

    #elev .body { flex: 1; display: flex; gap: 14px; padding-top: 8px; min-height: 0; }
    #elev.folded .body, #elev.folded .head { display: none; }
    #elev .head { border-top: none; }
    .elev-info { width: 300px; flex: none; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
    .elev-info .cur { flex: none; background: #fff7ed; border: 1px solid #fdba74; border-radius: 9px; padding: 7px 9px; font-size: 12px; color: #7c2d12; line-height: 1.55; }
    /* 通知项（原底部悬浮 evbar 并入此处，去掉魔法数字定位） */
    .elev-info .notice {
        flex: none; display: flex; gap: 6px; align-items: flex-start;
        background: #fffbeb; border: 1px solid #fcd34d; border-radius: 9px;
        padding: 7px 8px; font-size: 11.5px; color: #92400e; line-height: 1.5;
    }
    .elev-info .notice b { color: #b45309; }
    .elev-info .notice button {
        flex: none; border: none; background: none; cursor: pointer;
        font-size: 12px; color: #b45309; padding: 0 2px; line-height: 1.3;
    }
    /* 能耗对照：两个可折叠小节，默认收起；展开时占用的高度由图表 170px 低保额度吸收 */
    details.rules { flex: none; border: 1px solid #e2e8f0; border-radius: 9px; background: #f8fafc; }
    details.rules > summary {
        cursor: pointer; list-style: none; padding: 6px 9px; font-size: 11.5px;
        color: #0f766e; font-weight: 600; user-select: none; display: flex; align-items: center; gap: 5px;
    }
    details.rules > summary::-webkit-details-marker { display: none; }
    details.rules > summary::before { content: '▸'; font-size: 9px; transition: transform .15s; }
    details.rules[open] > summary::before { transform: rotate(90deg); }
    details.rules > summary:hover { background: #f1f5f9; border-radius: 9px; }
    details.rules .rbody {
        padding: 2px 10px 8px; font-size: 11px; color: #64748b; line-height: 1.55;
        max-height: 148px; overflow-y: auto; border-top: 1px solid #e2e8f0;
    }
    details.rules .rbody b { color: #0f766e; }
    /* 图表高度由抽屉拖拽动态设置（JS 写 element.style.height） */
    .elev-chart { flex: 1; position: relative; min-width: 0; min-height: 90px; }
    .elev-chart svg { display: block; width: 100%; height: 100%; }
    #elevTip {
        position: absolute; pointer-events: none; display: none; z-index: var(--z-tip);
        background: #0f172a; color: #fff; border-radius: 8px; padding: 5px 9px;
        font-size: 11px; line-height: 1.5; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.3);
    }
    @media (max-width: 720px) {
        #elev .body { flex-direction: column; overflow-y: auto; }
        .elev-info { width: 100%; }
        details.rules .rbody { max-height: 96px; }
        /* 窄屏图表压矮，把省下的高度留给能耗卡片 */
        .elev-chart { flex: none; height: min(var(--drawer-h, 300px) * .42, 150px); }
        #elev .head b { font-size: 13px; }
        #elevTitle { display: none; }
    }
    /* ============ 移动端底部抽屉系统（S14，≤768px；桌面零影响） ============
       结构：#panel 变底部行程单抽屉（peek 露手柄+标题+chips / full 全高 / hidden 收起），
       剖面抽屉 #elev 是第二张表（打开时盖住行程单）。手势/互斥逻辑在 engine/mobile.js。 */
    @media (max-width: 768px) {
        :root { --sheet-peek: 92px; }
        #panel {
            left: 0; right: 0; top: auto; bottom: 0; width: 100%;
            max-height: none; height: auto;
            border-radius: 18px 18px 0 0;
            padding: 6px 14px calc(10px + env(safe-area-inset-bottom));
            transform: translateY(calc(100% - var(--sheet-peek)));
            transition: transform .28s cubic-bezier(.32,.72,0,1);
        }
        #panel { overflow: hidden; }                             /* 非全展态内容不滚，避免 peek 里手势变成滚内容 */
        body.mob-full #panel { transform: none; height: calc(100vh - 24px); max-height: none; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        body.mob-hidden #panel { transform: translateY(100%); }
        body.mob-elev #panel { transform: translateY(100%); }   /* 剖面抽屉打开时行程单让位 */
        /* 两张表上下叠放（地图软件惯例）：行程单 peek 时，剖面把手贴在行程单下沿之上，
           地图容器相应缩短，三带互不重叠（--sheet-visible 由 mobile.js 按档位写入） */
        #map { height: calc(100vh - var(--elev-occupy, 0px) - var(--sheet-visible, 0px)); }
        #elev { transform: translateY(calc(100% - var(--peek, 46px) + 14px - var(--sheet-visible, 0px))); }
        #elev.open { transform: translateY(calc(-1 * var(--sheet-visible, 0px))); }
        body.mob-elev { --sheet-visible: 0px; }                 /* 剖面成为主表：落回贴底 */
        body.mob-full #elev { visibility: hidden; }              /* 全展看行程单时，不被剖面把手压住 */
        /* 手柄（mobile.js 注入 #sheetGrip）：手指友好的拖拽区 */
        .sheet-grip { display: flex; align-items: center; justify-content: center; height: 28px; margin: 0 -14px; cursor: grab; touch-action: none; }
        .sheet-grip::before { content: ''; width: 44px; height: 5px; border-radius: 3px; background: #cbd5e1; }
        body.mob-drag #panel { transition: none; }               /* 跟手 */
        /* 触控规范：可点元素 ≥44px */
        .day-list li { min-height: 48px; padding: 10px 8px; }
        .legend .row { min-height: 44px; }
        .legend > summary { display: block; min-height: 44px; line-height: 36px; }
        details.legend:not([open]) .row { display: none; }      /* 手机：图例行收进「图层」折叠区 */
        .switch { width: 46px; height: 27px; }
        .switch .knob { width: 21px; height: 21px; }
        .switch input:checked ~ .knob { left: 23px; }
        #panelFold { width: 34px; height: 34px; }
        .btn-fit { padding: 12px 0; }
        /* 标题/chips：chips 保持一行紧凑（三块在 390 宽下本就能挤下，已由 720 块降字号保证；
           不做 overflow-x 横滑——滚动容器在列 flex 里会被 Chromium 算成 0 高） */
        #panel h1 { font-size: 16px; }
        .chips { flex-wrap: nowrap; }
        /* 剖面抽屉把手加粗 */
        #elevGrip { height: 26px; }
        #elevGrip::before { width: 52px; height: 6px; }
        /* 编辑模式弹层：手机改底部全宽弹出（输入框不被键盘顶飞的几何锚点） */
        #wpGuide, #wpModal { top: auto; bottom: 0; left: 0; transform: none; width: 100%;
            border-radius: 18px 18px 0 0; max-height: 88vh; overflow-y: auto;
            padding-bottom: calc(14px + env(safe-area-inset-bottom)); box-sizing: border-box; }
        #wpModal input[type=text], #wpModal input[type=password] { min-height: 40px; }
        #wpModal textarea { height: 120px; }
        /* 横屏不强制适配但不破版：抽屉限高 */
        @media (orientation: landscape) {
            body.mob-full #panel { height: 82vh; }
        }
    }
    @media (min-width: 769px) {
        .sheet-grip { display: none; }
    }

    /* ============ 编辑模式（S5）：默认零痕迹；body.editing 才出现可点改提示 ============ */
    body.editing .day-title, body.editing .day-note, body.editing .day-stay,
    body.editing #routeSub, body.editing #evNotice {
        cursor: pointer;
        border-bottom: 1px dashed #f59e0b;
    }
    /* 出发日期（S13）：有日期时 day-tag 变宽容纳「D1 · 10月3日 周五」 */
    body.has-dep .day-tag { width: auto; padding: 3px 7px; white-space: nowrap; }
    body.editing .day-stay {
        display: inline-block; margin-top: 2px; font-size: 10.5px; color: #b45309;
        background: #fffbeb; border: 1px dashed #fcd34d; border-radius: 5px; padding: 0 5px;
    }
    .edit-toggle { background: #475569; margin-top: 6px; }
    .edit-toggle:hover { background: #334155; }
    body.editing .edit-toggle { background: #b45309; }
    .edit-bar { margin-top: 8px; padding: 8px; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 9px; font-size: 11px; color: #92400e; line-height: 1.6; }
    .edit-hint { display: block; margin-bottom: 6px; }
    .edit-mini { border: none; background: #0f766e; color: #fff; border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer; margin-right: 6px; font-family: inherit; }
    .edit-mini:hover { background: #0d9488; }
    .day-seg { display: block; margin-top: 2px; }
    .day-seg-sel { font-size: 10.5px; max-width: 96px; border: 1px solid #e2e8f0; border-radius: 5px; background: #fff; color: #475569; }
    .day-seg-hint { display: block; margin-top: 2px; font-size: 10px; color: #94a3b8; }
    /* 途经点增删引导（体验修复 2） */
    #wpGuide {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: var(--z-guide); width: min(560px, calc(100vw - 40px));
        background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
        box-shadow: 0 16px 48px rgba(15,23,42,.22); padding: 18px 20px;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    #wpGuide .wp-title { display: block; font-size: 15px; color: #0f172a; margin-bottom: 10px; }
    #wpGuide .wp-body {
        margin: 0 0 12px; padding: 10px 12px; background: #f8fafc; border-radius: 8px;
        font-size: 11.5px; line-height: 1.7; color: #475569; white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 220px; overflow: auto;
    }
    #wpGuide .wp-row { display: flex; gap: 8px; }
</style>
<script>
    /* ============ 地图 Key 预检（S9：高德 JS API） ============
       线路页底图由高德地图提供，需要「Web 端(JS API)」Key + 安全密钥（见 key.local.js，
       由 tools/make-key-local.js 从 .env.local 生成）。缺 Key 时表现为灰屏/空白，
       这里主动给出明确指引。选线器页（无 ?route= 参数）没有地图，整段跳过。 */
    (function () {
        // 选线器页（无 ?route= 参数）没有地图，跳过 Key 检查
        if (!/[?&]route=/.test(location.search)) return;
        // 扫描推迟到 DOMContentLoaded：key.local.js 由 loader document.write 写入，
        // 解析早期 window.__KEY_LOCAL__ 还不存在。
        var problems = null;
        function scan() {
            if (problems) return;
            problems = [];
            var K = (typeof window !== 'undefined' && window.__KEY_LOCAL__) || {};
            var hasKey = !!K.amapKey;
            var isFile = (location.protocol === 'file:');

            if (isFile) {
                problems.push({
                    t: '用了 file:// 直接打开',
                    d: '高德 JS API 在 file:// 下不稳定。请起一个本地服务：<code>python -m http.server 8000</code>，' +
                       '然后访问 <code>http://localhost:8000/index.html?route=线路id</code>。'
                });
            }
            if (!hasKey) {
                problems.push({
                    t: '地图 Key 缺失',
                    d: '本页面的底图由高德地图提供，需要「Web 端(JS API)」Key + 安全密钥。<br>' +
                       '去 <a href="https://lbs.amap.com/dev/" target="_blank" rel="noopener">高德开放平台</a>' +
                       ' 控制台 → 应用管理 → 创建应用 → 添加 Key（服务平台选 <b>Web端(JS API)</b>），' +
                       '把 Key 和安全密钥写进仓库根 <code>.env.local</code>（<code>AMAP_JS_KEY</code> / ' +
                       '<code>AMAP_JS_SECURITY_CODE</code>），再运行 <code>node tools/make-key-local.js</code>。' +
                       '<br>（key.local.js 已 gitignore，不会进 git。）'
                });
            }
        }

        window.__keyProblem = null;

        function show() {
            scan();
            if (!problems || !problems.length) return;
            window.__keyProblem = problems;
            if (document.getElementById('__keyHint')) return;
            var box = document.createElement('div');
            box.id = '__keyHint';
            box.setAttribute('style',
                'position:fixed;inset:0;z-index:var(--z-tip);display:flex;align-items:center;justify-content:center;' +
                'background:linear-gradient(160deg,#f8fafc,#e2e8f0);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;' +
                'padding:24px;box-sizing:border-box;overflow:auto;');
            var items = problems.map(function (p) {
                return '<li style="margin:0 0 14px;"><b style="color:#b91c1c;font-size:14px;">' + p.t + '</b>' +
                       '<div style="margin-top:6px;color:#475569;font-size:13px;line-height:1.7;">' + p.d + '</div></li>';
            }).join('');
            box.innerHTML =
                '<div style="max-width:560px;background:#fff;border-radius:16px;padding:28px 30px;' +
                'box-shadow:0 12px 40px rgba(15,23,42,.18);border:1px solid #e2e8f0;">' +
                '<h2 style="margin:0 0 6px;font-size:19px;color:#0f172a;">地图没能加载出来</h2>' +
                '<p style="margin:0 0 20px;color:#64748b;font-size:13px;">' +
                '页面数据本身是完整的（路线、海拔、补能点都已内联），差的只是底图。按下面修一下就好：</p>' +
                '<ol style="margin:0;padding-left:22px;">' + items + '</ol>' +
                '<p style="margin:20px 0 0;padding-top:16px;border-top:1px solid #f1f5f9;color:#94a3b8;font-size:12px;">' +
                '详见仓库 README 的「配置地图 Key」一节。</p>' +
                '</div>';
            document.body.appendChild(box);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', show);
        } else {
            show();
        }
    })();
</script>
</head>
<body>
<div id="map"></div>
<button id="panelHandle" title="展开行程面板">☰ 行程</button>

<div id="panel">
    <h1><span id="routeName">自驾线路图</span>
        <span class="seg" id="startSeg"></span>
        <button id="panelFold" title="收起侧栏">‹</button>
    </h1>
    <div class="sub" id="routeSub"></div>
    <div class="chips">
        <div class="chip"><b id="chipKm">—</b>总里程 km</div>
        <div class="chip"><b id="chipDays">—</b>建议天数</div>
        <div class="chip"><b id="chipMaxAlt">—</b>最高海拔 m</div>
    </div>
    <ul class="day-list" id="dayList"></ul>
    <details class="legend" id="legendBox" open>
        <summary>图层 · 站点开关</summary>
        <div class="row"><span class="name"><span class="dot line"></span>主路线</span><span id="dirNote">沿线方向</span></div>
        <div class="row"><span class="name"><span class="dot city"></span>城镇 / 补给点</span><label class="switch"><input type="checkbox" id="tgCity" checked><span class="track"></span><span class="knob"></span></label></div>
        <div class="row"><span class="name"><span class="dot spot"></span>景点 / 垭口</span><label class="switch"><input type="checkbox" id="tgSpot" checked><span class="track"></span><span class="knob"></span></label></div>
        <div class="row"><span class="name"><span class="dot fuel"></span>加油站（关键段）<span class="tierHint" id="fuelTierHint"></span></span><label class="switch"><input type="checkbox" id="tgFuel" checked><span class="track"></span><span class="knob"></span></label></div>
        <div class="row"><span class="name"><span class="dot ev"></span>充电站（快充）</span><label class="switch"><input type="checkbox" id="tgEv" checked><span class="track"></span><span class="knob"></span></label></div>
        <div class="row" id="classicRow"><span class="name"><span class="dot cls"></span><span id="classicLabel">支线</span></span><label class="switch"><input type="checkbox" id="tgClassic"><span class="track"></span><span class="knob"></span></label></div>
    </details>
        <div class="evcard">
        <div class="evrow">
            <span class="seg">
                <button id="btnEv" class="on">⚡ 电车</button>
                <button id="btnFuel">⛽ 油车</button>
            </span>
            <span id="rngLabel">满电续航</span>
        </div>
        <div class="evrow">
            <input type="range" id="rngRange" min="300" max="1000" step="10" value="500" style="flex:1">
            <b id="rngVal" style="color:#0f766e;min-width:58px;text-align:right">500 km</b>
        </div>
        <div class="evrow">
            <label style="display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" id="ckAlt" checked> 高原折算 ×0.85（低温/风阻/爬升）</label>
        </div>
        <div class="evplan" id="planBox"></div>
    </div>
    <button class="btn-fit" id="btnFit">回到全览</button>
    <div class="tip">点击图标看详情 · 点击某天地图飞行 + 剖面高亮 · 底部可展开海拔剖面。<span id="dataCaveat">加油站/充电站为公开资料整理，出发前请复核营业状态。</span></div>
</div>

<!-- 电车提示：作为抽屉内的通知项，不再用魔法数字固定在页面中部 -->

<!-- 海拔剖面 & 能耗（底部抽屉，可拖拽调节高度） -->
<div id="elev" class="folded">
    <div id="elevGrip" title="拖动调节高度 · 向下拖到底收起"></div>
    <div class="head" id="elevHead">
        <b id="elevToggle">📈 海拔剖面 &amp; 能耗影响</b>
        <span class="fold" id="elevTitle"></span>
        <span class="spacer"></span>
        <span class="fold" id="elevFoldHint">拖动或点击标题展开</span>
        <button class="closebtn" id="elevClose" title="收起">✕</button>
    </div>    <div class="body">
        <div class="elev-chart" id="chartBox">
            <div id="elevTip"></div>
        </div>
        <div class="elev-info">
            <div class="cur" id="curEnergy">点选上方任意一天，看这段的海拔与能耗提示。</div>
            <div class="notice" id="evNotice">
                <span></span>
                <button title="关闭" onclick="document.getElementById('evNotice').remove()">✕</button>
            </div>
            <details class="rules" id="rulesClimb">
                <summary>能耗怎么读 · 爬升与电耗</summary>
                <div class="rbody"></div>
            </details>
            <details class="rules" id="rulesEnv">
                <summary>能耗怎么读 · 高原 / 风 / 油车</summary>
                <div class="rbody"></div>
            </details>
        </div>
    </div>
</div>

<script src="route-defs/manifest.js"></script>
<script>
    /* S8：多线路入口 + 按需加载。
       有 ?route=<id>（且 id 在 manifest 登记）→ 只加载该线路包 + 引擎 + 底图 SDK；
       无参数或 id 未登记 → 只加载 picker.js 选线器（不加载任何线路包/引擎/底图）。 */
    var ROUTE_KEY = (location.search.match(/[?&]route=([a-z0-9-]+)/) || [])[1] || '';
    var ROUTE_VALID = ROUTE_KEY && (typeof ROUTE_MANIFEST !== 'undefined') &&
        ROUTE_MANIFEST.some(function (r) { return r.id === ROUTE_KEY; });
    if (ROUTE_KEY && !ROUTE_VALID) {
        // 未登记的 id：回选线器（不产生半加载状态）
        location.replace(location.pathname);
    } else if (ROUTE_VALID) {
        // 线路页加载序交給 boot-route.js：key.local.js（本地 Key）→ 安全密钥 →
        // 底图 SDK（高德 JS API v2）→ 线路包 → 引擎。无 Key 时全跳过，只留引导遮罩。
        document.write('<script src="key.local.js"><\/script>');
        document.write('<script src="engine/boot-route.js"><\/script>');
    } else {
        document.write('<script src="engine/picker.js"><\/script>');
    }
</script>
</body>
</html>
